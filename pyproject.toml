[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "capscale"
version = "0.1.0"
description = "Real-time capture-card upscaler for console gameplay"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy", "av>=14", "sounddevice"]

[project.scripts]
capscale = "capscale.app:main"

[tool.maturin]
python-source = "python"
module-name = "capscale._core"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
