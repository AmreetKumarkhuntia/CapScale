# ps5scaler settings. Saving this file applies the changes while the app runs.
# The options panel (F1) edits the same values; its Save button rewrites the
# [output], [params], [passes] and [audio] sections below.

[capture]
device = ""          # empty: use the popup (its last choice is remembered in last_source.json)
width = 1920
height = 1080
fps = 60
format = "auto"      # auto | mjpeg | nv12 | yuyv422   (auto prefers raw when the card is fast enough)
audio_device = ""    # empty: the sound input named after the capture device

[hotkeys]
Escape = "quit"
F1 = "toggle:panel"
F2 = "toggle:overlay"
F3 = "toggle:split"
F4 = "cycle:upscaler"
F5 = "toggle:rcas"
F6 = "toggle:grade"
F7 = "toggle:lut"
F8 = "toggle:audio"
F9 = "pick_source"
F11 = "toggle:fullscreen"
# other actions: "save" (write the current settings to this file), "pick_lut"

[output]
width = 2560            # 0 x 0: fit the display
height = 1440
fullscreen = true
vsync = "immediate"    # mailbox | fifo | immediate

[params]
upscaler = "easu"    # easu | lanczos3 | bilinear
sharpness = 0.0      # RCAS, AMD's scale: 0.0 is sharpest, each +1.0 halves it, up to 2.0
exposure = 0.3       # stops
contrast = 1.1
saturation = 1.4
vibrance = 0.15
temperature = 0.1    # -1 cool .. +1 warm
tint = 0.25           # -1 green .. +1 magenta
gamma = 1.15
lift = 0.0           # a number, or [r, g, b]
lgg_gamma = 1.25
gain = 1.3
lut_path = ""       # path to a .cube file
lut_strength = 1.0
split_pos = 0.40585938
full_range = true
matrix = "bt709"

[passes]
upscale = true       # false: plain bilinear
rcas = true
grade = true
lut = false
split = false        # before / after, drag the divider
overlay = true       # fps, latency, per-pass GPU time

[audio]
enabled = true
volume = 1.0
delay_ms = 0.0       # hold the sound back, if it arrives before the picture
