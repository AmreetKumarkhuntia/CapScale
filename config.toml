# capscale settings. Saving this file applies the changes while the app runs.
# The settings window (F1) edits the same values; its Save button rewrites the
# [output], [params], [passes] and [audio] sections below.

[capture]
device = ""          # picked on the settings window's Source tab; empty: the one started last time (last_source.json)
width = 1920
height = 1080
fps = 60
format = "auto"      # auto | mjpeg | nv12 | yuyv422   (auto prefers raw when the card is fast enough)
audio_device = ""    # empty: the sound input named after the capture device

[hotkeys]
Escape = "stop"      # close the picture window, back to the settings window
F1 = "toggle:panel"
F2 = "toggle:overlay"
F3 = "toggle:split"
F4 = "cycle:upscaler"
F5 = "toggle:rcas"
F6 = "toggle:grade"
F7 = "toggle:lut"
F8 = "toggle:audio"
F11 = "toggle:fullscreen"
# other actions: "quit", "save" (write the current settings to this file)

[output]
width = 2560            # 0 x 0: fit the display
height = 1440
fullscreen = true
vsync = "immediate"    # mailbox | fifo | immediate
backend = "dx12"     # auto | dx12 | vulkan; used at the next start

[params]
upscaler = "bilinear"    # easu | lanczos3 | bilinear
sharpness = 0.95      # RCAS, AMD's scale: 0.0 is sharpest, each +1.0 halves it, up to 2.0
exposure = -0.5       # stops
contrast = 1.1
saturation = 1.5
vibrance = 0.15
temperature = 0.1    # -1 cool .. +1 warm
tint = 0.2           # -1 green .. +1 magenta
gamma = 1.35
lift = -0.01           # a number, or [r, g, b]
lgg_gamma = 1.13
gain = 1.47
lut_path = ""       # path to a .cube file
lut_strength = 1.0
split_pos = 0.40585938
content_fps = 0.0    # the game's own frame rate; 0.0 measures it
target_fps = 60.0     # frame generation up to this rate; 0.0 is off
hud_zones = []    # kept out of frame generation: [left, top, right, bottom, 1.0 if round]
ai_framegen = true   # true: frames from the AI model (see README); false: built-in
ai_still = true       # AI method: still areas are left as the real picture
full_range = true
matrix = "bt709"

[passes]
upscale = true       # false: plain bilinear
rcas = true
grade = true
lut = false
split = false        # before / after, drag the divider
overlay = false       # fps, latency, per-pass GPU time

[audio]
enabled = true
volume = 1.0
delay_ms = 0.0       # hold the sound back, if it arrives before the picture
